services:
  api:
    build:
      context: ./api
    container_name: radar-climatico-api
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: radar-climatico-frontend

    ports:
      - "5173:5173"

    environment:
      - VITE_WS_URL=ws://localhost:8000/ws/predictions

    depends_on:
      - api
